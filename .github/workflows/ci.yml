name: CI

on:
  push:
    branches: [ main, develop ]
    
jobs: 
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          global-json-file: global.json
          
      - name: Restore
        run: dotnet restore Micros.sln
      
      - name: Build
        run: dotnet build Micros.sln --configuration Release --no-restore
        
      - name: Tests-HHParser
        run: >
          dotnet test tests/Micros.HHParser.Tests/Micros.HHParser.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          
      - name: Tests-Api
        run: >
          dotnet test tests/Micros.Api.Tests/Micros.Api.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal